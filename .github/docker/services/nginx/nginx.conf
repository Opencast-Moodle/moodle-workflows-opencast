user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    server_tokens off;

    server {

        listen 80;
        listen 8081;
        listen 8080;

        add_header Referrer-Policy strict-origin-when-cross-origin;

        # CORS free
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers 'Origin,Content-Type,Accept,Authorization' always;

        # Always respond with 200 to OPTIONS requests as browsers do not accept
        # non-200 responses to CORS preflight requests.
        if ($request_method = OPTIONS) {
            return 200;
        }

        # Accept large ingests
        client_max_body_size 0;

        #JWKs setup
        location /.well-known/ {
            root /var/www/html;
            # This explicitly allows access to the directory
            # while other parts of the site might have a different config.
            allow all;
        }

        location / {
            proxy_set_header        Host $http_host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_pass http://opencast:8080;

            proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=none; Partitioned";


            # Do not buffer responses
            proxy_buffering         off;

            # Do not buffer requests
            proxy_request_buffering off;
        }

        #Octoka static file protections
        location /static/ {
            proxy_pass http://opencast_octoka:4050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
